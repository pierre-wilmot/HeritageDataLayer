# Heritage node configuration. Copy to node.toml and edit.
# Relative paths are relative to this file.

# Site index: a git repo containing sites.json ("<scheme>:<id>" -> repo URL),
# or a local path to a sites.json file.
index = "https://github.com/pierre-wilmot/HeritageRepos.git"

# Keys this node trusts, in OpenSSH allowed_signers format:
#   name namespaces="git,heritage-photo" ssh-ed25519 AAAA...
# "git" trusts a key to sign commits, "heritage-photo" to vouch for photos.
# Anything not signed by these keys waits for review in the UI.
allowed_signers = "allowed_signers"

# Most photo data this node will pin (B, KB, MB, GB, TB; KiB, MiB, GiB too).
# Sites are filled in preference order; lower-ranked sites are unpinned first.
max_storage = "2GB"

# Sites close to your heart, hosted first, in this order. Every other site in
# the index follows in a random order unique to this node.
favourites = [
  "historic-england-nhle:1472163",  # The Crow Stone
]

# Where the node keeps its mirrors and state.
data_dir = "/var/lib/heritage-node"

# Seconds between syncs (a review decision triggers one immediately).
poll_interval = 900

# Review UI. Keep it on localhost and reach it through an SSH tunnel:
#   ssh -L 8090:127.0.0.1:8090 your-node   then open http://127.0.0.1:8090/
admin_listen = "127.0.0.1:8090"
# Extra Host headers the UI accepts, e.g. ["heritage-node.local:8090"] on a LAN.
admin_hosts = []

# Required: the UI is password protected. Generate the line with
#   python3 heritage_node.py hash-password
admin_password_hash = ""
# Set to true when the UI is served over HTTPS (e.g. behind nginx), so the
# session cookie is only ever sent encrypted.
admin_https = false
session_hours = 12

# Read-only public mirror of the approved git history ("" = off),
# e.g. "0.0.0.0:8091". Clone with: git clone http://<node>:8091/git/<site>.git
public_listen = ""

# Per-photo and per-repository limits.
max_photo_bytes = "50MB"
max_repo_bytes = "50MB"

# Seconds to wait for a photo from IPFS before trying again next sync.
ipfs_timeout = 300

# Uncomment to use an IPFS repo other than the default ($IPFS_PATH or ~/.ipfs).
# ipfs_path = "/var/lib/heritage-node/ipfs"

# Uncomment to fix the random ranking instead of deriving it from the peer ID.
# node_seed = "my-node"
